name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # contents: write is needed to publish the test-build release below, which is
  # how a phone gets the APK: Actions artifacts are zipped and need a signed-in
  # GitHub session, a release asset is a plain link that works anywhere.
  contents: write
  checks: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14.3
          fi

      # Every Gradle invocation is teed into one log so a failure can be turned
      # into annotations below. Job logs are not reachable from every
      # environment, and a red build that will not say why costs a whole cycle.
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: set -o pipefail; ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a gradle-output.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: set -o pipefail; ./gradlew lintDebug --stacktrace 2>&1 | tee -a gradle-output.log

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle-output.log

      - name: Annotate build failures
        if: always()
        run: |
          python3 - <<'PY'
          import os, re

          try:
              log = open("gradle-output.log", errors="replace").read().splitlines()
          except FileNotFoundError:
              raise SystemExit

          emitted = 0
          root = os.getcwd() + "/"

          def emit(message, path=None, line=None):
              global emitted
              if emitted >= 40:
                  return
              message = " ".join(message.split())
              if not message:
                  return
              where = f"file={path},line={line or 1}," if path else ""
              print(f"::error {where}title=Build failure::{message[:900]}")
              emitted += 1

          kotlin = re.compile(r"^e: file://(?P<path>[^:]+):(?P<line>\d+):\d+ (?P<msg>.*)$")
          aapt = re.compile(r"^(?:ERROR|error): (?P<path>/[^:]+):(?P<line>\d+):?\s*(?P<msg>.*)$")

          for raw in log:
              m = kotlin.match(raw.strip()) or aapt.match(raw.strip())
              if m:
                  emit(m.group("msg"), m.group("path").replace(root, ""), m.group("line"))

          for i, raw in enumerate(log):
              if raw.strip().startswith("* What went wrong:"):
                  block = []
                  for follow in log[i + 1:i + 12]:
                      if follow.strip().startswith("* Try:"):
                          break
                      block.append(follow.strip())
                  emit(" ".join(block))

          for raw in log:
              if " FAILED" in raw and "> Task" not in raw:
                  emit(raw.strip())

          if emitted == 0:
              print("::notice title=Build::No failure lines matched in the Gradle output.")
          PY

      - name: Fail if any Gradle step failed
        if: steps.tests.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.assemble.outcome == 'failure'
        run: |
          echo "tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }} assemble=${{ steps.assemble.outcome }}"
          exit 1

      - name: Assemble release APK (unsigned, for size only)
        run: ./gradlew assembleRelease --stacktrace

      - name: Report APK sizes
        run: |
          DEBUG=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "::notice title=Debug APK size::$(du -h "$DEBUG" | cut -f1)"
          if [ -n "$RELEASE" ]; then
            echo "::notice title=Release APK size (the number the store listing claims)::$(du -h "$RELEASE" | cut -f1)"
          fi

      - name: Name the debug APK for humans
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mv "$APK" app/build/outputs/apk/debug/roshan-camera-debug.apk

      - name: Upload build output and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            gradle-output.log
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish the debug APK as a downloadable test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Debug build of the latest commit on `main`. Tap
            `roshan-camera-debug.apk` below to install it on a phone.

            Signed with the standard Android debug key, so it installs
            alongside a Play Store copy rather than replacing it. Not for
            distribution.

            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
