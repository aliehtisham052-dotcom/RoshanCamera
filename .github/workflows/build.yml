name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # contents: write is needed to publish the test-build release below, which is
  # how a phone gets the APK: Actions artifacts are zipped and need a signed-in
  # GitHub session, a release asset is a plain link that works anywhere.
  contents: write
  checks: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14.3
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Annotate lint problems
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          level = {"Fatal": "error", "Error": "error", "Warning": "warning"}
          found = 0
          for report in glob.glob("app/build/reports/lint-results-*.xml"):
              for issue in ET.parse(report).getroot().findall("issue"):
                  sev = issue.get("severity", "Warning")
                  if sev not in level:
                      continue
                  loc = issue.find("location")
                  path = loc.get("file", "") if loc is not None else ""
                  line = loc.get("line", "1") if loc is not None else "1"
                  path = path.split("/RoshanCamera/", 1)[-1]
                  msg = (issue.get("message") or "").replace("\n", " ")
                  print(f"::{level[sev]} file={path},line={line},title={issue.get('id')}::{msg}")
                  found += 1
          if not found:
              print("::notice title=Lint::No lint problems reported.")
          PY

      - name: Fail the build if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Lint reported problems — see the annotations above."
          exit 1

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK (unsigned, for size only)
        run: ./gradlew assembleRelease --stacktrace

      - name: Report APK sizes
        run: |
          DEBUG=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "::notice title=Debug APK size::$(du -h "$DEBUG" | cut -f1)"
          if [ -n "$RELEASE" ]; then
            echo "::notice title=Release APK size (the number the store listing claims)::$(du -h "$RELEASE" | cut -f1)"
          fi

      - name: Name the debug APK for humans
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mv "$APK" app/build/outputs/apk/debug/roshan-camera-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roshan-camera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish the debug APK as a downloadable test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Debug build of the latest commit on `main`. Tap
            `roshan-camera-debug.apk` below to install it on a phone.

            Signed with the standard Android debug key, so it installs
            alongside a Play Store copy rather than replacing it. Not for
            distribution.

            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
